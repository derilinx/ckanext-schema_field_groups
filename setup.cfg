# This file should only contain setuptools related configuration to build the
# extension (i.e. arguments to setup() in setup.py). Add any other project
# information should go to pyproject.toml instead.
#
# TODO: migrate Babel options to pyproject.toml when it's better supported


[options]
packages = find:
namespace_packages = ckanext
install_requires =
include_package_data = True

[options.extras_require]

[extract_messages]
keywords = translate isPlural
add_comments = TRANSLATORS:
output_file = ckanext/schema_field_groups/i18n/ckanext-schema_field_groups.pot
width = 80

[init_catalog]
domain = ckanext-schema_field_groups
input_file = ckanext/schema_field_groups/i18n/ckanext-schema_field_groups.pot
output_dir = ckanext/schema_field_groups/i18n

[update_catalog]
domain = ckanext-schema_field_groups
input_file = ckanext/schema_field_groups/i18n/ckanext-schema_field_groups.pot
output_dir = ckanext/schema_field_groups/i18n
previous = true

[compile_catalog]
domain = ckanext-schema_field_groups
directory = ckanext/schema_field_groups/i18n
statistics = true
